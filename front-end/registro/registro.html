<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="box">
        <span class="borderLine"></span>
        <form>
            <h2>Registro</h2>
            <div class="inputBox">
                <input type="text" required="required">
                <span>ID</span>
                <i></i>
            </div>            
            <div class="inputBox">
                <input type="text" required="required">
                <span>Nombre</span>
                <i></i>
            </div>            
            <div class="inputBox">
                <input type="text" required="required">
                <span>Edad</span>
                <i></i>
            </div>
            <input type="submit" value="Ingresar">
            <!-- Enlaces adicionales (olvidó su contraseña, inscribirse) -->
            <div class="link">
                <p>Ya te habías inscrito</p>
                <a href="#">Iniciar sesión</a>
            </div>
        </form>
    </div>
</body>
</html>
